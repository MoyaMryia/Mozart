[package]
name = "mozart-web-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mozart-core = { path = "../core" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
futures-util = "0.3"
notify = "8"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
libc = "0.2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
