[package]
name = "mozart-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[[example]]
name = "pre_stub"
path = "examples/pre_stub.rs"

[[example]]
name = "rvc_stub"
path = "examples/rvc_stub.rs"

[[example]]
name = "rvc_echo"
path = "examples/rvc_echo.rs"

# 真模型冒烟探针（Jetson）：驱动 C++ 推理进程六命令 + 数据面收发。
[[example]]
name = "rvc_smoke"
path = "examples/rvc_smoke.rs"

# 语言链协议桩（daemon 监管/轮询/转发测试用）：只实现控制面，不做推理。
[[example]]
name = "asr_stub"
path = "examples/asr_stub.rs"

[[example]]
name = "tts_stub"
path = "examples/tts_stub.rs"

[[example]]
name = "bridge_stub"
path = "examples/bridge_stub.rs"

# llama-server 无控制协议，桩只保持存活供监管测试。
[[example]]
name = "llama_stub"
path = "examples/llama_stub.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
