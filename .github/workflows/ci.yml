name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # 检查命令只在 tools/ci-local.sh 中定义，本地 pre-commit hook 调用同一脚本。
      - name: 仓库卫生
        run: bash tools/ci-local.sh repo
      - name: 文档检查
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            bash tools/ci-local.sh lint --base-ref "$BASE_SHA"
          else
            bash tools/ci-local.sh lint
          fi
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config ccache \
            libasound2-dev libspdlog-dev libyaml-cpp-dev nlohmann-json3-dev \
            ffmpeg libavfilter-dev libavutil-dev
      - name: 构建与单元测试
        run: bash tools/ci-local.sh native

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pre/daemon 依赖 alsa-sys，需要 ALSA 开发库提供 alsa.pc。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # ubuntu-24.04 运行器自带稳定版 Rust 工具链。
      - name: 构建与单元测试（Rust）
        run: bash tools/ci-local.sh rust

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hashFiles 只在步骤级 if 中可用，因此逐步骤跳过。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: hashFiles('web/package.json') != ''
        run: npm --prefix web ci
      - if: hashFiles('web/package.json') != ''
        run: bash tools/ci-local.sh web
      - if: hashFiles('web/package.json') == ''
        run: echo "跳过 web：web/package.json 不存在"
