<div class="wrap">
<h1>Mozart 新架构 · 数据流洋葱拆解</h1>
<p class="sub">Rust 运行时 + C++ 推理，控制面单一权威（daemon）。图上每个节点就是一个模块；
<b>点节点</b>弹出锚定该节点的悬浮窗，窗内点组件/接口再展开字段级细节——逐层剥洋葱。✕ 或 Esc 收起。</p>

<div class="stage">
  <div class="canvas"><svg id="svg" viewBox="0 0 1020 560" role="img" aria-label="Mozart 新架构数据流"></svg></div>
  <div class="legend">
    <span><i style="border-color:var(--audio)"></i>音频数据</span>
    <span><i style="border-color:var(--text)"></i>文本 / 字幕</span>
    <span><i style="border-color:var(--ctl)"></i>控制 / 状态</span>
    <span><i style="border-color:var(--file)"></i>文件 / 存档</span>
    <span style="margin-left:auto">虚线流动方向 = 数据流向 · 接收方 bind / 发送方 connect</span>
  </div>
  <p class="hint">▸ 点任意节点展开悬浮窗。socket 路径相对 run_dir；帧契约与控制信封在相应节点的 proto 层。</p>
</div>

 asr:{bin:'mozart-asr',desc:'Rust 单进程 sherpa-onnx 库链入。收包/解码/复核/输出四线程+控制。每次启动随机启动号。',pts:[
  ['thread','receiver','收包','<p>bind asr-in，push SPSC 环，不分配不阻塞；1s 空闲切句。</p>'],

  ['thread','review','复核','<p>SenseVoice int8。队列容量 2，整句所有权移交；队满 skipped；加载失败每句 failed 不影响在线。</p>'],
  ['thread','output','事件','<p>独占 asr-events(SEQPACKET，ASR 监听桥连接)。断连 final/refined 补发、partial 丢；超限丢最旧。</p>'],
  ['sock','asr.sock','bind 0x04xx','<table class="kv"><tr><td>0x0401</td><td>Hello {version,startup_id}</td></tr><tr><td>0x0402</td><td>GetStatus</td></tr></table>'],
  ['proto','识别事件','asr-events','<pre>{type: partial|final|refined,\n startup_id:"c1c71f10", utterance_id:"c1c71f10:6",\n text, refinement_status,\n asr_numeric_audit:null, asr_polarity_audit:null}</pre>']]},
 bridge:{bin:'mozart-bridge',desc:'单进程多线程。收字/写字幕/翻译/投递都在进程内。桥是开关活权威。',pts:[
  ['thread','events','收字','<p>connect asr-events，读循环只入队；启动号校验，断连 500ms 重连；有界通道，丢弃可查询。</p>'],
  ['thread','subtitles','落盘','<p>记录表 LRU(128/64，保护在途)。追加 jsonl 逐行 flush。revision 创建 0 每次+1 final 粘滞。</p>'],
  ['thread','translate','编排','<p>final→预处理→llama→质检→落字幕→投递。传输失败重试≤2。off 只发原文。</p>'],
  ['thread','preprocess+quality','预处理/质检','<p>同音纠错表(可配置)+数字归一化，纠错作用于 zh。全套旧质检(数字/角色/否定/未翻译/截断)+长度比补充。</p>'],
  ['thread','speech','投递','<p>有界队列队满丢最旧。connect tts-jobs 发 SUBMIT 读回执。off 停新投递；stop 发 JOB_STOP+清队列。</p>'],
  ['sock','bridge.sock','bind 0x05xx','<table class="kv"><tr><td>0x0501</td><td>Hello</td></tr><tr><td>0x0502</td><td>GetStatus(四组)</td></tr><tr><td>0x0503/04/05</td><td>Translate/SpeechSet/Stop</td></tr></table>'],
  ['proto','字幕记录','jsonl','<pre>{seq, utterance_id:"启动号:句号", zh, en,\n final:bool, translation_status:pending|recognizing|\n completed|failed|skipped, revision, received_at, ts,\n asr_engine, online_text, homophone_fixes,\n refinement_status, asr_numeric_audit}</pre>'],
  ['file','状态持久化','开关','<p>TOML 基线 + 运行时覆盖由 daemon 写 ~/.local/state/mozart/state.json，启动与桥重启时恢复，不回落基线。</p>']]},
 llama:{bin:'llama-server (C++)',desc:'第三方翻译推理。系统唯一 HTTP 之处，传输仍 Unix socket。daemon 只管存活。',pts:[
  ['proto','HTTP 接口','llama.sock','<pre>POST /v1/chat/completions\n{model, messages[system,user], max_tokens:128,\n temperature:0,\n chat_template_kwargs:{enable_thinking:false}}\n→ choices[0].message.content + finish_reason</pre><p class="note">Qwen3.5 思考模型必须关 thinking，否则译文为空。</p>'],
  ['proto','模型参数','沿用旧','<p>Qwen3.5-0.8B Q4_K_M。-c 2048 -b 256 -ub 128 --cache-ram 128 -ngl 99 -np 1 -t 2 -tb 2 --host .sock --jinja。板端已确认支持。</p>']]},
 tts:{bin:'mozart-tts',desc:'Rust 独立进程 sherpa TTS。参考音色合成，v1 不走变声、48k 直喂 pre。',pts:[

  ['thread','synth','PocketTTS','<p>int8，参考 WAV 启动加载。num_steps5/speed1/silence_scale1/seed"42"。安全:非有限/peak&gt;4 拒、归一化、时长上限 min(45,max(4,len*0.35+2))。</p>'],
  ['thread','resample+output','24k→48k','<p>线性插值升采样打包 OutputFrame；connect tts-out，20ms/帧节拍防溢出。经变声 16k 留 FUTURE。</p>'],
  ['sock','tts.sock','bind 0x06xx','<table class="kv"><tr><td>0x0601/02</td><td>Hello/GetStatus</td></tr><tr><td>0x0610/11</td><td>JobSubmit/JobReply</td></tr><tr><td>0x0612</td><td>JobStop</td></tr></table>']]},
 sub:{bin:'subtitles.jsonl',desc:'字幕发布点与存档。持久本地存储，重启保留。推流方读文件。',pts:[
  ['file','路径','XDG','<p>默认 ~/.local/state/mozart/subtitles.jsonl，经 [bridge] subtitles_path 配置。v1 不轮转。</p>'],
  ['proto','记录格式','沿用旧','<p>见 bridge「字幕记录」层。revision 覆盖语义；译文先于投递落盘。</p>']]},
 mic:{bin:'ALSA',desc:'硬件输入，全系统只打开一次。',pts:[['proto','采集','48kHz','<p>48kHz 单声道 RawFrame(960 样本/20ms)。所有音频必经 pre。</p>']]},
 spk:{bin:'ALSA',desc:'硬件输出。同一时刻一路占用（扬声器分时）。',pts:[['proto','播放','分时','<p>实时/直出在 pre 内切换；播报时静音实时、播完恢复。播放采样率固定 48kHz，设备给不到 48000Hz 即报错退出，不按流协商。</p>']]}
};

var pop=R.querySelector('#pop'),curSel=null;
function closeP(){pop.classList.remove('on');if(curSel){nodeEls[curSel].classList.remove('sel');curSel=null;}}
R.querySelector('#px').onclick=function(e){e.stopPropagation();closeP();};
function open(id,g){
 if(curSel)nodeEls[curSel].classList.remove('sel');
 curSel=id;nodeEls[id].classList.add('sel');
 var n=N[id],d=D[id];
 R.querySelector('#pnm').textContent=n.t;
 R.querySelector('#pbin').textContent=d.bin;
 pop.style.borderTopColor='var(--'+n.c+')';
 var body=R.querySelector('#pbody');
 body.innerHTML='<p class="pdesc">'+d.desc+'</p>'+d.pts.map(function(p){
   return '<div class="pt"><div class="h">'+CV+'<span class="tag '+p[0]+'">'+p[0]+'</span><span class="nm2">'+p[1]+'</span><span class="nt">'+p[2]+'</span></div><div class="b">'+p[3]+'</div></div>';}).join('');
 body.querySelectorAll('.pt>.h').forEach(function(h){h.onclick=function(e){e.stopPropagation();h.parentNode.classList.toggle('open');};});
 pop.classList.add('on');
 var r=g.getBoundingClientRect(),W=420,pw=Math.min(W,window.innerWidth-24);
 var left=r.right+12; if(left+pw>window.innerWidth-12) left=Math.max(12,r.left-pw-12);
 var top=Math.max(12,Math.min(window.innerHeight-160,r.top-20));
 pop.style.left=left+'px'; pop.style.top=top+'px';
}
svg.addEventListener('click',function(ev){var g=ev.target.closest('g.node');if(g){open(g.dataset.id,g);}else closeP();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeP();});
})();
